spring:
  application:
    name: document-notification-service

  datasource:
    url: jdbc:h2:mem:documentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

aws:
  region: us-east-1
  sqs:
    queue-name: bank-collections-document-notification-queue
server:
 port: 8083    